<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1e3a2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  
  <!-- Arka plan -->
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#glow)"/>
  
  <!-- Grid dokusu -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="340"/><line x1="40" y1="0" x2="40" y2="340"/><line x1="80" y1="0" x2="80" y2="340"/><line x1="120" y1="0" x2="120" y2="340"/><line x1="160" y1="0" x2="160" y2="340"/><line x1="200" y1="0" x2="200" y2="340"/><line x1="240" y1="0" x2="240" y2="340"/><line x1="280" y1="0" x2="280" y2="340"/><line x1="320" y1="0" x2="320" y2="340"/><line x1="360" y1="0" x2="360" y2="340"/><line x1="400" y1="0" x2="400" y2="340"/><line x1="440" y1="0" x2="440" y2="340"/><line x1="480" y1="0" x2="480" y2="340"/><line x1="520" y1="0" x2="520" y2="340"/><line x1="560" y1="0" x2="560" y2="340"/><line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="0" y1="0" x2="600" y2="0"/><line x1="0" y1="40" x2="600" y2="40"/><line x1="0" y1="80" x2="600" y2="80"/><line x1="0" y1="120" x2="600" y2="120"/><line x1="0" y1="160" x2="600" y2="160"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="240" x2="600" y2="240"/><line x1="0" y1="280" x2="600" y2="280"/><line x1="0" y1="320" x2="600" y2="320"/>
  </g>
  
  <!-- Altın çizgi alt -->
  <rect x="0" y="330" width="600" height="2" fill="#34d399" opacity="0.6"/>
  
  <!-- Merkez ikon dairesi -->
  <circle cx="300" cy="155" r="68" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="300" cy="155" r="50" fill="#34d399" fill-opacity="0.06"/>
  
  <!-- İkon -->
  <text x="300" y="172" font-size="48" text-anchor="middle" dominant-baseline="middle">📋</text>
  
  <!-- EGG rozeti -->
  <rect x="220" y="260" width="160" height="36" rx="18" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-width="1" stroke-opacity="0.4"/>
  <text x="300" y="283" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="3">EGG GÜVENLİK</text>
  
  <!-- Köşe aksan -->
  <circle cx="20" cy="20" r="4" fill="#34d399" opacity="0.4"/>
  <circle cx="580" cy="20" r="4" fill="#34d399" opacity="0.4"/>
  <circle cx="20" cy="320" r="4" fill="#34d399" opacity="0.4"/>
  <circle cx="580" cy="320" r="4" fill="#34d399" opacity="0.4"/>
</svg>